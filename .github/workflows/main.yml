name: Global Repair geek

on:
  push:
    branches:
      - main  # Deploys when code is pushed to the "main" branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v5

    - name: Upload to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        timeout: 120000
        server: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USERNAME }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/globalrepairgeek
        exclude: |
          **/.git*
          **/.git*/**
          .github/**
          **/node_modules/**
          .env
          README.md
          *.yml